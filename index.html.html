<title>سكرتارية المهندس عدي عواد التميمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#EDF0F4;
    --paper:#F6F8FA;
    --surface:#FFFFFF;
    --ink:#16233A;
    --muted:#64748B;
    --line:#DCE3EC;
    --primary:#0E2A47;
    --primary-2:#17416B;
    --gold:#A9843B;
    --gold-soft:#F1E7D2;
    --bloc:#8A6A2A;
    --bloc-soft:#F3E9D3;
    --finance:#1F5142;
    --finance-soft:#DEEAE3;
    --office:#6B4FA0;
    --office-soft:#EDE6F5;
    --danger:#A6392C;
    --danger-soft:#FBEAE6;
    --reminder:#B8791E;
    --reminder-soft:#FBF0DD;
    --ok:#2C6E49;
    --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; justify-content:center;
  }
  h1,h2,h3,.disp{font-family:'Cairo',sans-serif;}
  #app{ width:100%; max-width:480px; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column; }

  /* ===== Login ===== */
  .login-wrap{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 26px calc(28px + var(--safe-b)); background:linear-gradient(160deg,var(--primary) 0%, #071523 100%); }
  .login-seal{ width:70px;height:70px;border-radius:50%; margin:0 auto 18px; background:radial-gradient(circle at 35% 30%, #1B3E63, var(--primary)); border:2px solid var(--gold); display:flex;align-items:center;justify-content:center; }
  .login-seal svg{width:36px;height:36px;}
  .login-seal img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
  .login-title{ text-align:center; color:#fff; margin-bottom:26px; }
  .login-title h1{font-size:19px;margin:0 0 6px;font-weight:800;}
  .login-title span{font-size:12px;color:#CFE4DA;}
  .login-card{ background:var(--surface); border-radius:20px; padding:22px; }
  .login-card .field{margin-bottom:13px;}
  .login-card label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  .login-card input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-family:'Tajawal';font-size:14px;background:var(--paper);}
  .login-err{ background:var(--danger-soft); color:var(--danger); font-size:12px; font-weight:700; padding:9px 12px; border-radius:10px; margin-bottom:12px; display:none; }
  .login-err.show{display:block;}
  .login-btn{ width:100%; background:var(--primary); color:#fff; border:none; border-radius:13px; padding:13px; font-family:'Tajawal'; font-size:14px; font-weight:800; cursor:pointer; margin-top:4px; }
  .login-hint{ text-align:center; color:#CFE4DA; font-size:11px; margin-top:16px; line-height:1.7; }

  /* ===== Top bar ===== */
  .topbar{ position:sticky; top:0; z-index:30; background:var(--primary); color:#fff; padding:calc(14px + var(--safe-t)) 18px 16px; border-radius:0 0 22px 22px; box-shadow:0 6px 18px rgba(18,49,40,.18); }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .seal{ width:42px;height:42px;border-radius:50%; background:radial-gradient(circle at 35% 30%, #1B3E63, var(--primary)); border:2px solid var(--gold); display:flex;align-items:center;justify-content:center; flex-shrink:0; overflow:hidden; }
  .seal svg{width:22px;height:22px;}
  .seal img{width:100%;height:100%;object-fit:cover;}
  .topbar-title{display:flex; align-items:center; gap:10px; min-width:0;}
  .topbar-title .txt{min-width:0;}
  .topbar-title .txt h1{font-size:15px;margin:0;font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-title .txt span{font-size:11px;color:#CFE4DA;font-weight:500;}
  .icon-btns{display:flex; gap:8px; flex-shrink:0;}
  .icon-btn{ position:relative; width:38px;height:38px;border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); display:flex;align-items:center;justify-content:center; color:#fff; cursor:pointer; }
  .icon-btn svg{width:17px;height:17px;}
  .badge-count{ position:absolute; top:-4px; left:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:800; min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--primary); }
  .stat-strip{ display:flex; gap:8px; margin-top:16px; }
  .stat-chip{ flex:1; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); border-radius:13px; padding:8px 6px; text-align:center; cursor:pointer; font-family:'Tajawal'; color:#fff; }
  .stat-chip b{display:block; font-size:15px; font-family:'Cairo'; font-weight:800;}
  .stat-chip span{font-size:9.5px; color:#CFE4DA;}

  /* ===== Content ===== */
  .content{flex:1; padding:16px 16px calc(100px + var(--safe-b)); }
  .content.no-nav{padding-bottom:calc(30px + var(--safe-b));}
  .section-title{ display:flex; align-items:center; justify-content:space-between; margin:4px 2px 10px; }
  .section-title h2{font-size:15px; margin:0; font-weight:800; color:var(--primary);}
  .section-title small{color:var(--muted); font-size:11.5px;}

  .alert-banner{ background:var(--danger-soft); border:1px solid #EFC9C0; color:var(--danger); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:13px; font-weight:700; }
  .alert-banner.reminder{background:var(--reminder-soft); border-color:#EBD3A2; color:var(--reminder);}
  .alert-banner svg{width:18px;height:18px; flex-shrink:0;}

  /* ===== Task card ===== */
  .task-card{ background:var(--surface); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px; display:flex; gap:11px; align-items:flex-start; border:1px solid var(--line); position:relative; overflow:hidden; }
  .task-card::before{ content:''; position:absolute; right:0; top:0; bottom:0; width:5px; }
  .task-card.cat-finance::before{background:var(--finance);}
  .task-card.cat-bloc::before{background:var(--bloc);}
  .task-card.cat-office::before{background:var(--office);}
  .check-btn{ width:24px;height:24px;border-radius:50%; border:2px solid var(--line); background:#fff; flex-shrink:0; margin-top:2px; cursor:pointer; display:flex;align-items:center;justify-content:center; padding:0; }
  .check-btn.done{background:var(--ok); border-color:var(--ok);}
  .check-btn svg{width:13px;height:13px; color:#fff; display:none;}
  .check-btn.done svg{display:block;}
  .task-body{flex:1; min-width:0;}
  .task-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .task-title{font-size:14px; font-weight:700; margin:0; line-height:1.4;}
  .task-top .task-title{flex:1; min-width:0;}
  .task-top-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-mini{ width:28px;height:28px;border-radius:50%; border:1.5px solid var(--line); background:#fff; color:var(--muted); display:flex;align-items:center;justify-content:center; cursor:pointer; padding:0; }
  .icon-mini svg{width:13px;height:13px;}
  .icon-mini.danger{color:var(--danger); border-color:#EFC9C0;}
  .status-select{ margin-top:10px; width:100%; border:1.5px solid var(--line); border-radius:10px; padding:8px 11px; font-family:'Tajawal'; font-size:12px; font-weight:700; background:#fff; color:var(--muted); cursor:pointer; }
  .status-select.status-completed{border-color:var(--ok); color:var(--ok); background:#EAF5EE;}
  .status-select.status-rejected{border-color:var(--danger); color:var(--danger); background:var(--danger-soft);}
  .status-select.status-pending{border-color:var(--reminder); color:var(--reminder); background:var(--reminder-soft);}
  .task-title.done{text-decoration:line-through; color:var(--muted);}
  .task-desc{font-size:12.5px; color:var(--muted); margin:4px 0 8px; line-height:1.5;}
  .task-meta{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .tag{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .tag.finance{background:var(--finance-soft); color:var(--finance);}
  .tag.bloc{background:var(--bloc-soft); color:var(--bloc);}
  .tag.office{background:var(--office-soft); color:var(--office);}
  .tag.emp{background:var(--bg); color:var(--muted); font-weight:500;}
  .tag.overdue{background:var(--danger-soft); color:var(--danger);}
  .tag.remind{background:var(--reminder-soft); color:var(--reminder);}
  .tag.time{background:#F0F2ED; color:var(--muted); font-weight:500;}
  .tag.attach{background:var(--bg); color:var(--primary); text-decoration:none; display:inline-flex; align-items:center; gap:4px;}
  .tag.attach svg{width:11px;height:11px;}

  .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty-state .ico{ width:56px;height:56px;border-radius:50%;background:var(--surface); display:flex;align-items:center;justify-content:center;margin:0 auto 14px; border:1px solid var(--line); }
  .empty-state .ico svg{width:26px;height:26px; color:var(--gold);}
  .empty-state p{font-size:13px; margin:0; max-width:230px; margin:0 auto; line-height:1.6;}

  .file-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:9px; display:flex; align-items:center; gap:10px; }
  .file-ico{ width:36px;height:36px;border-radius:10px; background:var(--office-soft); color:var(--office); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .file-ico svg{width:17px;height:17px;}
  .file-info{flex:1; min-width:0;}
  .file-info p{margin:0; font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .file-info span{font-size:10.5px; color:var(--muted);}
  .file-dl{ width:34px;height:34px;border-radius:50%; background:var(--primary); color:#fff; display:flex;align-items:center;justify-content:center; flex-shrink:0; text-decoration:none; }
  .file-dl svg{width:15px;height:15px;}

  .agenda-filters{display:flex; gap:8px; margin-bottom:14px;}
  .agenda-filter-btn{ flex:1; border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 4px; font-family:'Tajawal'; font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; }
  .agenda-filter-btn.active{background:var(--primary); border-color:var(--primary); color:#fff;}
  .agenda-date-head{ display:flex; justify-content:space-between; align-items:center; margin:18px 2px 9px; font-family:'Cairo'; font-weight:800; font-size:12.5px; color:var(--primary); }
  .agenda-date-head.is-today{color:var(--gold);}
  .agenda-item{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .agenda-time{ font-family:'Cairo'; font-weight:800; font-size:13px; color:var(--primary); background:var(--gold-soft); border-radius:10px; padding:6px 9px; flex-shrink:0; min-width:52px; text-align:center; }
  .agenda-body{flex:1; min-width:0;}
  .agenda-del{ background:none; border:none; color:var(--danger); flex-shrink:0; cursor:pointer; padding:4px; }
  .agenda-del svg{width:16px;height:16px;}

  /* ===== Employee card ===== */
  .emp-card{ background:var(--surface); border-radius:var(--radius); border:1px solid var(--line); margin-bottom:10px; overflow:hidden; }
  .emp-head{ display:flex; align-items:center; gap:11px; padding:13px 14px; cursor:pointer; }
  .avatar{ width:40px;height:40px;border-radius:50%; background:var(--gold-soft); color:var(--gold); display:flex;align-items:center;justify-content:center; font-weight:800; font-family:'Cairo'; font-size:15px; flex-shrink:0; overflow:hidden; }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .avatar svg{width:18px;height:18px;}
  .emp-info{flex:1; min-width:0;}
  .emp-info h3{margin:0; font-size:14px; font-weight:700;}
  .emp-info span{font-size:11.5px; color:var(--muted);}
  .emp-counts{display:flex; gap:6px; flex-shrink:0;}
  .count-pill{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--bg); color:var(--muted);}
  .count-pill.warn{background:var(--danger-soft); color:var(--danger);}
  .chevron{width:16px;height:16px; color:var(--muted); transition:transform .2s;}
  .emp-card.open .chevron{transform:rotate(180deg);}
  .emp-tasks{display:none; padding:0 14px 14px;}
  .emp-card.open .emp-tasks{display:block;}
  .cred-box{ background:var(--paper); border:1px dashed var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; font-size:12px; }
  .cred-row{display:flex; justify-content:space-between; align-items:center; padding:3px 0;}
  .cred-row b{color:var(--muted); font-weight:600;}
  .cred-row code{font-family:monospace; font-size:12.5px; background:#fff; border:1px solid var(--line); padding:2px 8px; border-radius:6px;}
  .row-actions{display:flex; gap:8px; margin-top:8px;}
  .row-actions button{ flex:1; background:none; border:1px solid var(--line); border-radius:9px; color:var(--muted); font-size:11px; font-weight:700; padding:7px; cursor:pointer; font-family:'Tajawal'; display:flex; align-items:center; justify-content:center; gap:5px; }
  .row-actions button svg{width:13px;height:13px;}
  .rep-input{ border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:'Tajawal'; font-size:12.5px; background:var(--surface); color:var(--ink); }
  .row-actions button.danger{color:var(--danger); border-color:#EFC9C0;}

  /* ===== Reports tab ===== */
  .report-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
  .report-card h3{font-size:13.5px; margin:0 0 4px; font-weight:800;}
  .report-card p{font-size:11.5px; color:var(--muted); margin:0 0 12px;}
  .report-card select{width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:'Tajawal'; font-size:12.5px; margin-bottom:10px; background:var(--paper);}
  .export-btn{ width:100%; background:var(--primary); color:#fff; border:none; border-radius:11px; padding:11px; font-family:'Tajawal'; font-size:12.5px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; }
  .export-btn svg{width:15px;height:15px;}

  /* ===== Bottom nav ===== */
  .bottomnav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:8px 4px calc(8px + var(--safe-b)); z-index:40; }
  .nav-btn{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-family:'Tajawal'; font-size:8px; font-weight:700; padding:3px 0; cursor:pointer; min-width:0; }
  .nav-btn span:first-of-type{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .nav-btn svg{width:16px;height:16px;}
  .nav-btn.active{color:var(--primary);}
  .nav-btn .dot{width:5px;height:5px;border-radius:50%; background:var(--primary); margin-top:-1px; opacity:0;}
  .nav-btn.active .dot{opacity:1;}

  .fab{ position:fixed; bottom:calc(78px + var(--safe-b)); left:50%; transform:translateX(calc(-50% + 190px)); width:54px;height:54px;border-radius:50%; background:var(--gold); color:#fff; border:none; display:flex;align-items:center;justify-content:center; box-shadow:0 8px 18px rgba(169,132,59,.4); z-index:35; cursor:pointer; }
  .fab.no-nav{bottom:calc(24px + var(--safe-b));}
  .fab svg{width:24px;height:24px;}

  /* ===== Sheet / modal ===== */
  .overlay{ position:fixed; inset:0; background:rgba(10,20,15,.45); z-index:50; display:none; justify-content:center; }
  .overlay.show{display:flex;}
  .sheet{ width:100%; max-width:480px; background:var(--paper); align-self:flex-end; border-radius:24px 24px 0 0; padding:8px 20px calc(24px + var(--safe-b)); max-height:88vh; overflow-y:auto; animation:slideup .25s ease; }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:38px;height:4px;background:var(--line); border-radius:3px; margin:8px auto 14px;}
  .sheet h2{font-size:16px; margin:0 0 16px; font-weight:800; color:var(--primary);}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px;}
  .field input, .field textarea, .field select{ width:100%; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 13px; font-family:'Tajawal'; font-size:13.5px; color:var(--ink); }

  .field select{appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%236B7A70" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'); background-repeat:no-repeat; background-position:left 12px center; background-size:16px;}
  .field-sub{font-size:10.5px; color:var(--muted); margin-top:5px;}
  .cat-toggle{display:flex; gap:6px;}
  .cat-opt{ flex:1; border:1.5px solid var(--line); border-radius:12px; padding:9px 4px; text-align:center; font-size:11.5px; font-weight:700; cursor:pointer; color:var(--muted); }
  .cat-opt.sel-finance{border-color:var(--finance); background:var(--finance-soft); color:var(--finance);}
  .cat-opt.sel-bloc{border-color:var(--bloc); background:var(--bloc-soft); color:var(--bloc);}
  .cat-opt.sel-office{border-color:var(--office); background:var(--office-soft); color:var(--office);}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{ flex:1; border:none; border-radius:13px; padding:13px; font-family:'Tajawal'; font-size:13.5px; font-weight:800; cursor:pointer; }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-ghost{background:var(--surface); color:var(--muted); border:1px solid var(--line);}
  .logo-preview{ width:80px;height:80px;border-radius:50%; margin:0 auto 14px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--surface); }
  .logo-preview img{width:100%;height:100%;object-fit:cover;}
  .logo-preview svg{width:26px;height:26px;color:var(--muted);}
  .file-btn{ display:block; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px; font-size:12.5px; font-weight:700; color:var(--primary); cursor:pointer; margin-bottom:14px; }
  .replies-box{ margin-top:10px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .reply-item{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; }
  .reply-item p{ margin:4px 0 0; font-size:12px; color:var(--ink); line-height:1.6; }
  .reply-head{ display:flex; justify-content:space-between; align-items:center; }
  .reply-head b{ font-size:11.5px; color:var(--primary); }
  .reply-head span{ font-size:10px; color:var(--muted); }
  .reply-form{ margin-top:6px; }
  .reply-text{ width:100%; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-family:'Tajawal'; font-size:12.5px; min-height:56px; resize:vertical; margin-bottom:8px; background:var(--surface); color:var(--ink); }
  .divider{height:1px; background:var(--line); margin:18px 0;}

  .loading{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--muted); font-size:13px;}
  /* ===== Desktop layout (wide screens) ===== */
  @media (min-width: 900px){
    body{ align-items:flex-start; }
    #app{ max-width:1180px; box-shadow:0 0 40px rgba(14,42,71,.08); }
    #root.app-shell{
      display:grid;
      grid-template-columns:230px 1fr;
      grid-template-areas:"nav topbar" "nav content";
      grid-template-rows:auto 1fr;
      min-height:100vh;
    }
    #root.app-shell .topbar{ grid-area:topbar; border-radius:0 0 0 22px; }
    #root.app-shell .topbar-row, #root.app-shell .stat-strip{ max-width:760px; margin-inline:auto; }
    #root.app-shell .content{ grid-area:content; max-width:820px; margin-inline:auto; width:100%; padding:28px 32px calc(40px + var(--safe-b)); }
    #root.app-shell .bottomnav{
      grid-area:nav; position:sticky; top:0; align-self:start;
      left:auto; right:auto; bottom:auto; transform:none;
      width:230px; max-width:230px; min-height:100vh; height:auto;
      flex-direction:column; justify-content:flex-start;
      border-top:none; border-inline-start:1px solid var(--line);
      padding:24px 14px; gap:4px; z-index:1;
    }
    #root.app-shell .nav-btn{
      flex-direction:row; justify-content:flex-start; gap:12px;
      padding:11px 14px; border-radius:12px; font-size:13px;
    }
    #root.app-shell .nav-btn.active{ background:var(--bg); }
    #root.app-shell .nav-btn svg{ width:19px; height:19px; }
    #root.app-shell .nav-btn .dot{ display:none; }
    #root.app-shell .fab{ right:auto; left:40px; transform:none; bottom:36px; }
    .overlay{ align-items:center; }
    .sheet{ align-self:center; border-radius:20px; max-height:85vh; box-shadow:0 20px 60px rgba(14,42,71,.25); }
    .login-wrap{ max-width:440px; margin:0 auto; width:100%; }
  }
</style>

  function getSoundEnabled(){

  }

  function playBeep(){
    if (!getSoundEnabled()) return;
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime;
      [0, 0.22].forEach(delay=>{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t0+delay);
        gain.gain.exponentialRampToValueAtTime(0.35, t0+delay+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0+delay+0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0+delay); osc.stop(t0+delay+0.22);
      });
    }catch(e){ console.error('sound error', e); }
  }

    const relevant = alertRelevantTasks();
    lastOverdueIds = new Set(relevant.filter(isOverdueTask).map(t=>t.id));
    lastReplyCounts = {};
    relevant.forEach(t=>{ lastReplyCounts[t.id] = (t.replies||[]).length; });
    alertBaselineSet = true;
  }
  function showBrowserNotification(title, body){
    try{
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const n = new Notification(title, { body, tag: 'secretariat-alert', renotify: true });
      n.onclick = ()=>{ window.focus(); n.close(); };
    }catch(e){ console.error('notification error', e); }
  }
  function checkAlertSound(){
    if (!state.session || !alertBaselineSet) return;
    const relevant = alertRelevantTasks();
    const currentOverdueIds = new Set(relevant.filter(isOverdueTask).map(t=>t.id));
    const newOverdueTitles = [];
    currentOverdueIds.forEach(id=>{
      if (!lastOverdueIds.has(id)){
        const t = relevant.find(x=>x.id===id);
        if (t) newOverdueTitles.push(t.title);
      }
    });
    const newReplyTitles = [];
    relevant.forEach(t=>{
      const count = (t.replies||[]).length;
      const prevCount = lastReplyCounts[t.id] || 0;
      if (count > prevCount){
        const latest = (t.replies||[])[count-1];
        if (!latest || latest.authorId !== state.session.id) newReplyTitles.push(t.title);
      }
      lastReplyCounts[t.id] = count;
    });
    lastOverdueIds = currentOverdueIds;
    if (newOverdueTitles.length || newReplyTitles.length){
      playBeep();
      if (newOverdueTitles.length){
        showBrowserNotification('مهمة متأخرة ⏰', newOverdueTitles.length===1 ? `تجاوزت المهمة "${newOverdueTitles[0]}" 24 ساعة دون إنجاز` : `${newOverdueTitles.length} مهام تجاوزت 24 ساعة دون إنجاز`);
      }
      if (newReplyTitles.length){
        showBrowserNotification('رد جديد 💬', newReplyTitles.length===1 ? `وصل رد جديد على مهمة "${newReplyTitles[0]}"` : `وصلت ردود جديدة على ${newReplyTitles.length} مهام`);
      }
    }
  }

  const root = document.getElementById('root');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const now = () => Date.now();
  const hoursSince = (ts) => (now() - ts) / 3600000;
  const escapeHTML = (s) => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  function genUsername(name){
    const base = 'user' + Math.floor(1000 + Math.random()*9000);
    return base;
  }
  function genPassword(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
    let p='';
    for(let i=0;i<8;i++) p += chars[Math.floor(Math.random()*chars.length)];
    return p;
  }

  /* ===== Firebase / Firestore ===== */
  function col(name){ return db.collection('secretariat_'+name); }

  function safeRender(){
    const active = document.activeElement;
    if (active && root.contains(active) && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
    render();
  }

  function getStoredSessionId(){
    try { return localStorage.getItem('secretariat_session_id'); } catch(e){ return null; }
  }
  function setStoredSessionId(id){
    try { if (id) localStorage.setItem('secretariat_session_id', id); else localStorage.removeItem('secretariat_session_id'); } catch(e){}
  }

  function checkAllLoaded(){
    if (state.loaded) return;
    if (!Object.values(loadFlags).every(Boolean)) return;
    state.loaded = true;
    if (!state.accounts.length){
      state.accounts = [ADMIN_DEFAULT];
      col('accounts').doc(ADMIN_DEFAULT.id).set(ADMIN_DEFAULT).catch(e=>console.error(e));
    }
    if (!state.session){
      const storedId = getStoredSessionId();
      if (storedId){
        const acc = state.accounts.find(a=>a.id===storedId);
        if (acc) state.session = acc;
      }
    }
    render();
  }

  function onCollUpdate(key){
    return (snap)=>{
      state[key] = snap.docs.map(d=>d.data());
      loadFlags[key] = true;
      if (!state.loaded) checkAllLoaded(); else {
        if (key==='accounts' && state.session){
          const upd = state.accounts.find(a=>a.id===state.session.id);
          if (upd) state.session = upd;
        }
        safeRender();
      }
    };
  }

  function initFirebase(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){
      console.error(e); state.connError = true; render(); return;
    }
    const onErr = ()=>{ state.connError = true; render(); };
    col('tasks').onSnapshot(snap=>{
      state.tasks = snap.docs.map(d=>d.data());
      loadFlags.tasks = true;
      if (!state.loaded) checkAllLoaded();
      else { checkAlertSound(); safeRender(); }
    }, onErr);
    col('employees').onSnapshot(onCollUpdate('employees'), onErr);
    col('accounts').onSnapshot(onCollUpdate('accounts'), onErr);
    col('agenda').onSnapshot(onCollUpdate('agenda'), onErr);
    col('ministries').onSnapshot(snap=>{
      state.ministries = snap.docs.map(d=>d.data());
      loadFlags.ministries = true;
      if (!state.loaded) checkAllLoaded();
      else if (state.ministriesSheetOpen) openMinistriesSheet();
      else safeRender();
    }, onErr);
    col('letters').onSnapshot(onCollUpdate('letters'), onErr);
    col('office_requests').onSnapshot(onCollUpdate('officeRequests'), onErr);
    col('offices').onSnapshot(snap=>{
      state.offices = snap.docs.map(d=>d.data());
      loadFlags.offices = true;
      if (!state.loaded) checkAllLoaded();
      else if (state.officesSheetOpen) openOfficesSheet();
      else safeRender();
    }, onErr);
    col('meta').doc('config').onSnapshot(doc=>{
      state.logo = doc.exists ? (doc.data().logo || null) : null;
      loadFlags.logo = true;
      updateAppIcon(state.logo);
      if (!state.loaded) checkAllLoaded(); else safeRender();
    }, onErr);
  }

  function updateAppIcon(logoDataUrl){
    try{
      const href = logoDataUrl || DEFAULT_ICON_DATAURL;
      const fav = document.getElementById('app-favicon');
      const touch = document.getElementById('app-touch-icon');
      if (fav) fav.href = href;
      if (touch) touch.href = href;
    }catch(e){}
  }

  /* ===== Derived ===== */
  function myTasks(){
    if (state.session.role==='admin') return state.tasks;
    return state.tasks.filter(t=>t.employeeId===state.session.employeeId);
  }
  function isOverdueTask(t){ return t.status==='pending' && hoursSince(t.createdAt) >= 24; }
  function overdueTasks(){ return state.tasks.filter(isOverdueTask).sort((a,b)=>a.createdAt-b.createdAt); }
  function activeTasksOf(list){ return list.filter(t=>t.status==='pending').sort((a,b)=>b.createdAt-a.createdAt); }
  function remindDays(t){ return Math.floor(hoursSince(t.createdAt)/24); }

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function nowTimeStr(){
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  function dayNameOf(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return DAY_NAMES[d.getDay()];
  }
  function formatDateArabic(dateStr){
    const [y,m,day] = dateStr.split('-');
    return `${day}/${m}/${y}`;
  }
  function agendaVisible(){
    const t = todayStr();
    let list = state.agenda.slice();
    if (state.agendaFilter==='today') list = list.filter(a=>a.date===t);
    else if (state.agendaFilter==='upcoming') list = list.filter(a=>a.date>=t);
    return list.sort((a,b)=> a.date===b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
  }

  function timeLabelAdmin(t){
    if (t.status!=='pending') return null;
    const h = hoursSince(t.createdAt);
    if (h>=24){ const d=Math.floor(h/24); return {cls:'overdue', text:`متأخرة ${d>=1? d+' يوم' : Math.floor(h)+' ساعة'}`}; }
    const remain = 24-h;
    return {cls:'time', text: remain<1 ? `متبقٍ ${Math.round(remain*60)} د` : `متبقٍ ${Math.floor(remain)} س`};
  }
  function timeLabelEmployee(t){
    if (t.status!=='pending') return null;
    const d = remindDays(t);
    if (d>=1) return {cls:'remind', text:`تذكير: مرّ ${d} ${d===1?'يوم':'أيام'} دون إنجاز`};
    const h = hoursSince(t.createdAt);
    const remain = 24-h;
    return {cls:'time', text: `متبقٍ ${Math.max(0,Math.floor(remain))} س حتى التذكير`};
  }

  /* ===== Excel export ===== */
  function taskExcelRow(t){
    const emp = state.employees.find(e=>e.id===t.employeeId);
    return {
      'العنوان': t.title,
      'الوصف': t.desc || '',
      'الجهة': catInfo(t.category).label,
      'الموظف المكلف': emp ? emp.name : 'غير محدد',
      'تاريخ الإضافة': new Date(t.createdAt).toLocaleString('ar-IQ'),
      'تاريخ الاستحقاق': t.dueDate || '',
      'الحالة': (STATUS_LABELS[t.status] || 'قيد الإنجاز') + (isOverdueTask(t) ? ' (متأخرة)' : ''),
      'آخر تحديث للحالة': t.statusChangedAt ? new Date(t.statusChangedAt).toLocaleString('ar-IQ') : '',
      'عدد الردود': (t.replies||[]).length,
      'الملف المرفق': t.attachment ? t.attachment.name : ''
    };
  }
  function addStatusSheet(wb, tasks, sheetName){
    const rows = tasks.map(taskExcelRow);
    if (!rows.length) rows.push({'العنوان':'لا توجد مهام ضمن هذه الحالة','الوصف':'','الجهة':'','الموظف المكلف':'','تاريخ الإضافة':'','تاريخ الاستحقاق':'','الحالة':'','آخر تحديث للحالة':'','عدد الردود':'','الملف المرفق':''});
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:28},{wch:34},{wch:20},{wch:20},{wch:20},{wch:14},{wch:20},{wch:20},{wch:11},{wch:24}];
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }
  function exportTasksExcel(tasks, filename){
    const completed = tasks.filter(t=>t.status==='completed');
    const pending = tasks.filter(t=>t.status==='pending');
    const rejected = tasks.filter(t=>t.status==='rejected');
    const wb = XLSX.utils.book_new();
    addStatusSheet(wb, tasks, 'الكل');
    addStatusSheet(wb, completed, 'مكتملة');
    addStatusSheet(wb, pending, 'قيد الإنجاز');
    addStatusSheet(wb, rejected, 'مرفوضة');
    XLSX.writeFile(wb, filename);
  }

  /* ===== Rendering ===== */
  function taskCardHTML(t, ctxRole){
    const emp = state.employees.find(e=>e.id===t.employeeId);
    const tl = ctxRole==='employee' ? timeLabelEmployee(t) : timeLabelAdmin(t);
    const status = t.status || 'pending';
    const isAdminCtx = ctxRole==='admin';
    const replies = t.replies || [];
    const repliesOpen = state.openTaskReplies === t.id;
    return `
    <div class="task-card cat-${t.category} status-${status}">
      <div class="task-body">
        <div class="task-top">
          <p class="task-title ${status!=='pending'?'done':''}">${escapeHTML(t.title)}</p>
          <div class="task-top-actions">
            ${isAdminCtx ? `
            <button class="icon-mini" data-action="editTask" data-id="${t.id}" title="تعديل">${ICONS.edit}</button>
            <button class="icon-mini danger" data-action="delTask" data-id="${t.id}" title="حذف">${ICONS.trash}</button>` : ''}
          </div>
        </div>
        ${t.desc ? `<p class="task-desc">${escapeHTML(t.desc)}</p>` : ''}
        <div class="task-meta">
          <span class="tag ${t.category}">${catInfo(t.category).short}</span>
          ${(ctxRole!=='employee' && emp) ? `<span class="tag emp">${escapeHTML(emp.name)}</span>` : ''}
          ${t.dueDate ? `<span class="tag emp">📅 ${formatDateArabic(t.dueDate)}</span>` : ''}
          ${tl ? `<span class="tag ${tl.cls}">${tl.text}</span>` : ''}
          ${t.attachment ? `<a class="tag attach" href="${t.attachment.dataUrl}" download="${escapeHTML(t.attachment.name)}">${ICONS.attach}${escapeHTML(t.attachment.name.length>16 ? t.attachment.name.slice(0,13)+'…' : t.attachment.name)}</a>` : ''}
        </div>
        <select class="status-select status-${status}" data-action="statusChange" data-id="${t.id}">
          <option value="pending" ${status==='pending'?'selected':''}>⏳ قيد الإنجاز</option>
          <option value="completed" ${status==='completed'?'selected':''}>✓ مكتملة</option>
          <option value="rejected" ${status==='rejected'?'selected':''}>✕ مرفوضة</option>
        </select>
        <div class="row-actions" style="margin-top:8px;">
          <button data-action="toggleReplies" data-id="${t.id}">${ICONS.mail} الردود (${replies.length})</button>
        </div>
        ${repliesOpen ? `
        <div class="replies-box">
          ${replies.length ? replies.map(replyItemHTML).join('') : `<p style="font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0;">لا توجد ردود بعد.</p>`}
          <div class="reply-form">
            <textarea class="reply-text" data-id="${t.id}" placeholder="اكتب ردك هنا..."></textarea>
            <label class="file-btn" for="reply-file-${t.id}" id="reply-file-label-${t.id}">إرفاق ملف (PDF, Excel, Word, JPG)</label>
            <input type="file" id="reply-file-${t.id}" data-id="${t.id}" class="reply-file-input" accept=".pdf,application/pdf,.xls,.xlsx,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.jpg,.jpeg,image/jpeg" style="display:none">
            <div class="field-sub" id="reply-file-info-${t.id}">بحد أقصى 400 كيلوبايت للملف الواحد</div>
            <button class="btn btn-primary" style="width:100%; margin-top:8px;" data-action="sendReply" data-id="${t.id}">إرسال الرد</button>
          </div>
        </div>` : ''}
      </div>
    </div>`;
  }
  function replyItemHTML(r){
    return `
    <div class="reply-item">

  function renderAgenda(){
    const filters = [ {id:'today',label:'اليوم'}, {id:'upcoming',label:'القادمة'}, {id:'all',label:'الكل'} ];
    let html = `<div class="section-title"><h2>الجدول اليومي</h2><small>مواعيد واجتماعات وجلسات</small></div>`;
    html += `<div class="agenda-filters">${filters.map(f=>`<button class="agenda-filter-btn ${state.agendaFilter===f.id?'active':''}" data-action="agendaFilter" data-f="${f.id}">${f.label}</button>`).join('')}</div>`;
    const items = agendaVisible();
    if (!items.length){
      html += emptyState('calendar','لا توجد مواعيد أو اجتماعات مسجلة ضمن هذا العرض. اضغط زر الإضافة لتسجيل موعد جديد.');
      return html;
    }
    const groups = {};
    items.forEach(a=>{ (groups[a.date] = groups[a.date] || []).push(a); });
    const t = todayStr();
    Object.keys(groups).forEach(date=>{
      html += `<div class="agenda-date-head ${date===t?'is-today':''}"><span>${dayNameOf(date)}</span><span>${formatDateArabic(date)}${date===t?' · اليوم':''}</span></div>`;

  function letterExcelRow(l){

    };
  }
  function addLetterStatusSheet(wb, letters, sheetName){
    const rows = letters.map(letterExcelRow);
    if (!rows.length) rows.push({'الوزارة':'لا توجد كتب ضمن هذه الحالة','اسم المخول':'','تاريخ الكتاب':'','عدد الكتاب':'','الموضوع':'','اسم الشخص':'','الموظف المكلف':'','الحالة':'','تاريخ التسجيل':''});
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:22},{wch:20},{wch:14},{wch:14},{wch:34},{wch:20},{wch:20},{wch:14},{wch:20}];
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }
  function exportLettersExcel(letters, filename){
    const completed = letters.filter(l=>l.status==='completed');
    const pending = letters.filter(l=>l.status==='pending');
    const rejected = letters.filter(l=>l.status==='rejected');
    const wb = XLSX.utils.book_new();
    addLetterStatusSheet(wb, letters, 'الكل');
    addLetterStatusSheet(wb, completed, 'منجز');
    addLetterStatusSheet(wb, pending, 'قيد الإنجاز');
    addLetterStatusSheet(wb, rejected, 'مرفوض');
    XLSX.writeFile(wb, filename);
  }

  function openMinistriesSheet(){
    const overlay = document.getElementById('overlay');
    state.ministriesSheetOpen = true;
    overlay.classList.add('show');
    overlay.innerHTML = ministriesSheetHTML();
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });
    bindMinistriesSheetEvents();
  }
  function bindMinistriesSheetEvents(){
    const overlay = document.getElementById('overlay');
    overlay.querySelectorAll('[data-action="close"]').forEach(el=>el.addEventListener('click', closeSheet));
    const addBtn = overlay.querySelector('[data-action="addMinistry"]');
    if (addBtn) addBtn.addEventListener('click', ()=>{
      const input = overlay.querySelector('#m-new-name');
      const name = input.value.trim();
      if (!name){ input.focus(); return; }
      const id = uid();
      col('ministries').doc(id).set({ id, name, reps: [] }).catch(()=>alert('تعذر الحفظ، تحقق من الاتصال بالإنترنت'));
      input.value = '';
    });
    overlay.querySelectorAll('[data-action="toggleMinistry"]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.openMinistry = state.openMinistry===el.dataset.id ? null : el.dataset.id; openMinistriesSheet(); });
    });
    overlay.querySelectorAll('[data-action="delMinistry"]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if (confirm('حذف هذه الوزارة وكل المخولين التابعين لها؟')){
          col('ministries').doc(el.dataset.id).delete().catch(()=>alert('تعذر الحذف، تحقق من الاتصال بالإنترنت'));
        }
      });
    });
    overlay.querySelectorAll('[data-action="addRep"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const mid = el.dataset.mid;
        const input = overlay.querySelector(`.rep-input[data-mid="${mid}"]`);
        const name = input.value.trim();
        if (!name){ input.focus(); return; }
        const m = state.ministries.find(x=>x.id===mid);
        if (!m) return;
        const newReps = (m.reps||[]).concat([{id:uid(), name}]);
        col('ministries').doc(mid).update({reps:newReps}).catch(()=>alert('تعذر الحفظ، تحقق من الاتصال بالإنترنت'));
        input.value = '';
      });
    });
    overlay.querySelectorAll('[data-action="delRep"]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const mid = el.dataset.mid, rid = el.dataset.rid;
        const m = state.ministries.find(x=>x.id===mid);
        if (!m) return;
        const newReps = (m.reps||[]).filter(r=>r.id!==rid);
        col('ministries').doc(mid).update({reps:newReps}).catch(()=>alert('تعذر الحذف، تحقق من الاتصال بالإنترنت'));
      });
    });
  }

  function bindOfficesSheetEvents(){
    const overlay = document.getElementById('overlay');
    overlay.querySelectorAll('[data-action="close"]').forEach(el=>el.addEventListener('click', closeSheet));
    const addBtn = overlay.querySelector('[data-action="addOffice"]');
    if (addBtn) addBtn.addEventListener('click', ()=>{
      const input = overlay.querySelector('#of-new-name');
      const name = input.value.trim();
      if (!name){ input.focus(); return; }
      const id = uid();
      col('offices').doc(id).set({ id, name }).catch(()=>alert('تعذر الحفظ، تحقق من الاتصال بالإنترنت'));
      input.value = '';
    });
    overlay.querySelectorAll('[data-action="delOffice"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if (confirm('حذف هذا المكتب من القائمة؟')){
          col('offices').doc(el.dataset.id).delete().catch(()=>alert('تعذر الحذف، تحقق من الاتصال بالإنترنت'));
        }
      });
    });
  }

  function addOfficeReqStatusSheet(wb, reqs, sheetName){
    const rows = reqs.map(officeReqExcelRow);
    if (!rows.length) rows.push({'اسم صاحب الطلب':'لا توجد طلبات ضمن هذه الحالة','الموضوع':'','الجهة':'','اسم المكتب':'','رقم طلب المكتب':'','تأريخ طلب المكتب':'','حالة الطلب':'','حالة الكتاب':'','تأريخ الكتاب':'','تأريخ الكتاب المرفوع':'','الموظفون المكلفون':'','الملاحظات':'','تاريخ التسجيل':''});
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:20},{wch:30},{wch:18},{wch:20},{wch:16},{wch:16},{wch:14},{wch:14},{wch:14},{wch:16},{wch:22},{wch:26},{wch:20}];
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  }
  function exportOfficeReqExcel(reqs, filename){
    const completed = reqs.filter(r=>(r.requestStatus||'pending')==='completed');
    const pending = reqs.filter(r=>(r.requestStatus||'pending')==='pending');
    const rejected = reqs.filter(r=>(r.requestStatus||'pending')==='rejected');
    const wb = XLSX.utils.book_new();
    addOfficeReqStatusSheet(wb, reqs, 'الكل');
    addOfficeReqStatusSheet(wb, completed, 'منجز');
    addOfficeReqStatusSheet(wb, pending, 'قيد الإنجاز');
    addOfficeReqStatusSheet(wb, rejected, 'مرفوض');
    XLSX.writeFile(wb, filename);
  }

      <div class="login-seal">${sealHTML()}</div>
      <div class="login-title"><h1>سكرتارية المهندس عدي عواد التميمي</h1><span>اللجنة المالية · كتلة الصادقون النيابية · مكتب النائب</span></div>
      <div class="login-card">
        <div class="login-err ${state.loginError?'show':''}">${escapeHTML(state.loginError||'')}</div>
        <div class="field"><label>اسم المستخدم</label><input type="text" id="log-user" autocomplete="username"></div>
        <div class="field"><label>كلمة المرور</label><input type="password" id="log-pass" autocomplete="current-password"></div>
        <button class="login-btn" data-action="doLogin">تسجيل الدخول</button>
      </div>
    </div>`;
  }

  function render(){
    if (!FIREBASE_READY){ root.className=''; root.innerHTML = renderSetupNeeded(); return; }
    if (state.connError){ root.className=''; root.innerHTML = renderConnError(); return; }
    if (!state.loaded){ root.className=''; root.innerHTML = `<div class="loading">جارٍ التحميل...</div>`; return; }
    if (!state.session){ root.className=''; root.innerHTML = renderLogin(); bindLoginEvents(); return; }

    try{
      const isAdmin = state.session.role==='admin';
      if (!alertBaselineSet) initAlertBaseline();
      if (state.tab==='mail' && !hasMailAccess()) state.tab = 'home';
      let body = '';
      if (state.tab==='settings') body = renderSettings();
      else if (state.tab==='agenda') body = renderAgenda();
      else if (state.tab==='mail') body = renderMail();
      else if (state.tab==='officeRequests') body = renderOfficeRequests();
      else if (!isAdmin) body = renderHome();
      else if (state.tab==='home') body = renderHome();
      else if (state.tab==='alerts') body = renderAlerts();
      else if (state.tab==='employees') body = renderEmployees();
      else if (state.tab==='reports') body = renderReports();

      const showFab = state.tab==='agenda' || state.tab==='officeRequests' || (isAdmin && (state.tab==='home' || state.tab==='employees' || state.tab==='mail'));
      root.className = 'app-shell';
      root.innerHTML = `
        ${renderTopbar()}
        <div class="content">${body}</div>
        ${showFab ? `<button class="fab" data-action="fab">${ICONS.plus}</button>` : ''}
        ${renderNav()}
      `;
      bindEvents();
    }catch(err){
      console.error('render error:', err);
      root.className = '';
      root.innerHTML = `<div class="loading" style="flex-direction:column;gap:10px;padding:30px;text-align:center;">
        <div>حدث خطأ غير متوقع أثناء عرض البيانات.</div>
        <button class="login-btn" style="width:auto;padding:10px 20px;" onclick="location.reload()">إعادة تحميل الصفحة</button>
      </div>`;
    }
  }

  /* ===== Events ===== */
  function bindLoginEvents(){
    const btn = document.querySelector('[data-action="doLogin"]');
    const attempt = ()=>{
      const u = document.getElementById('log-user').value.trim();
      const p = document.getElementById('log-pass').value;
      const acc = state.accounts.find(a=>a.username===u && a.password===p);
      if (!acc){ state.loginError = 'اسم المستخدم أو كلمة المرور غير صحيحة'; render(); return; }
      state.loginError='';
      state.session = acc;
      state.tab='home';
      setStoredSessionId(acc.id);
      render();
    };
    btn.addEventListener('click', attempt);
    document.getElementById('log-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
  }

  function bindEvents(){
    root.querySelectorAll('[data-action="goto"]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; state.openEmp=null; render(); });
    });
    const logoutBtn = root.querySelector('[data-action="logout"]');
    if (logoutBtn) logoutBtn.addEventListener('click', ()=>{ state.session=null; setStoredSessionId(null); alertBaselineSet=false; render(); });

    root.querySelectorAll('[data-action="statusChange"]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const t = state.tasks.find(x=>x.id===el.dataset.id);
        if (!t) return;
        const newStatus = el.value;
        col('tasks').doc(t.id).update({status:newStatus, statusChangedAt: now()}).catch(()=>alert('تعذر حفظ التغيير، تحقق من الاتصال بالإنترنت'));
      });
    });
    root.querySelectorAll('[data-action="toggleReplies"]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.openTaskReplies = state.openTaskReplies===el.dataset.id ? null : el.dataset.id; render(); });
    });
    root.querySelectorAll('.reply-file-input').forEach(input=>{
      input.addEventListener('change', ()=>{
        const file = input.files[0];
        const tid = input.dataset.id;
        const infoEl = document.getElementById('reply-file-info-'+tid);
        const labelEl = document.getElementById('reply-file-label-'+tid);
        if (!file) return;
        const MAX = 400*1024;
        if (file.size > MAX){
          infoEl.style.color = 'var(--danger)';
          infoEl.textContent = 'الملف كبير جداً (الحد الأقصى 400 كيلوبايت). اختر ملفاً أصغر أو اضغطه.';
          input.value = '';
          delete pendingReplyAttachments[tid];
          return;
        }
        const reader = new FileReader();
        reader.onload = (e)=>{
          pendingReplyAttachments[tid] = { name: file.name, type: file.type, dataUrl: e.target.result, size: file.size };
          labelEl.textContent = 'تغيير الملف المختار';
          infoEl.style.color = 'var(--ok)';
          infoEl.textContent = `تم اختيار: ${file.name} (${Math.round(file.size/1024)} كيلوبايت)`;
        };
        reader.readAsDataURL(file);
      });
    });
    root.querySelectorAll('[data-action="sendReply"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const tid = el.dataset.id;
        const textEl = root.querySelector(`.reply-text[data-id="${tid}"]`);
        const text = textEl ? textEl.value.trim() : '';
        const attachment = pendingReplyAttachments[tid] || null;
        if (!text && !attachment){ if (textEl) textEl.focus(); return; }
        const t = state.tasks.find(x=>x.id===tid);
        if (!t) return;
        const reply = { id: uid(), authorName: state.session.name, authorId: state.session.id, text, attachment, createdAt: now() };
        const newReplies = (t.replies || []).concat([reply]);
        delete pendingReplyAttachments[tid];
        col('tasks').doc(tid).update({replies: newReplies}).catch(()=>alert('تعذر إرسال الرد، تحقق من الاتصال بالإنترنت'));

  function handleLogoFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 320;
        let w = img.width, h = img.height;
        if (w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        col('meta').doc('config').set({logo: dataUrl}, {merge:true}).catch(()=>alert('تعذر حفظ الشعار، تحقق من الاتصال بالإنترنت'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function handleAvatarFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 240;
        let w = img.width, h = img.height;
        if (w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        col('accounts').doc(state.session.id).update({avatar: dataUrl}).catch(()=>alert('تعذر حفظ الصورة، تحقق من الاتصال بالإنترنت'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  /* ===== Sheets (add task / add employee) ===== */
  function openSheet(type, editData){
    const overlay = document.getElementById('overlay');
    overlay.classList.add('show');
    overlay.innerHTML = type==='task' ? taskSheetHTML(editData) : (type==='agenda' ? agendaSheetHTML() : (type==='letter' ? letterSheetHTML(editData) : (type==='officeReq' ? officeReqSheetHTML(editData) : empSheetHTML())));
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSheet(); });
    bindSheetEvents(type, editData);
  }
  function closeSheet(){
    const overlay = document.getElementById('overlay');
    overlay.classList.remove('show');
    overlay.innerHTML='';
    state.ministriesSheetOpen = false;
    state.officesSheetOpen = false;
  }

  function taskSheetHTML(editData){
    const empOptions = state.employees.map(e=>`<option value="${e.id}">${escapeHTML(e.name)}</option>`).join('');
    const isEdit = !!editData;
    const cat = editData ? editData.category : 'finance';
    return `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>${isEdit ? 'تعديل المهمة' : 'إضافة مهمة جديدة'}</h2>
      <div class="field">
        <label>الجهة</label>
        <div class="cat-toggle">
          <div class="cat-opt ${cat==='finance'?'sel-finance':''}" data-cat="finance">اللجنة المالية</div>
          <div class="cat-opt ${cat==='bloc'?'sel-bloc':''}" data-cat="bloc">كتلة الصادقون</div>
          <div class="cat-opt ${cat==='office'?'sel-office':''}" data-cat="office">مكتب النائب</div>
        </div>
      </div>
      <div class="field"><label>عنوان المهمة</label><input id="f-title" type="text" placeholder="مثال: تجهيز محضر جلسة اللجنة" value="${editData ? escapeHTML(editData.title) : ''}"></div>
      <div class="field"><label>تفاصيل (اختياري)</label><textarea id="f-desc" placeholder="وصف مختصر للمهمة...">${editData ? escapeHTML(editData.desc||'') : ''}</textarea></div>
      <div class="field"><label>تاريخ الاستحقاق (اختياري)</label><input id="f-duedate" type="date" value="${editData ? (editData.dueDate||'') : ''}"></div>
      <div class="field"><label>إسناد إلى موظف (اختياري)</label><select id="f-emp"><option value="">بدون إسناد</option>${empOptions}</select></div>
      <div class="field">
        <label>${isEdit && editData.attachment ? 'استبدال الملف المرفق (اختياري)' : 'إرفاق ملف (اختياري)'}</label>
        <label class="file-btn" for="f-file" id="f-file-label">${isEdit && editData.attachment ? `الملف الحالي: ${escapeHTML(editData.attachment.name)} — اضغط للتغيير` : 'اختيار ملف من الجهاز'}</label>
        <input type="file" id="f-file" style="display:none">
        <div class="field-sub" id="f-file-info">بحد أقصى 600 كيلوبايت للملف الواحد (صورة، PDF، مستند...)</div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-action="close">إلغاء</button>
        <button class="btn btn-primary" data-action="saveTask">${isEdit ? 'حفظ التعديلات' : 'حفظ المهمة'}</button>
      </div>
    </div>`;
  }

  function letterSheetHTML(editData){
    const isEdit = !!editData;
    const ministryOptions = state.ministries.map(m=>`<option value="${m.id}" ${editData && editData.ministryId===m.id?'selected':''}>${escapeHTML(m.name)}</option>`).join('');
    const empOptions = state.employees.map(e=>`<option value="${e.id}" ${editData && editData.employeeId===e.id?'selected':''}>${escapeHTML(e.name)}</option>`).join('');
    return `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>${isEdit ? 'تعديل الكتاب' : 'تسجيل كتاب جديد'}</h2>
      ${state.ministries.length ? `
      <div class="field"><label>الوزارة</label><select id="l-ministry"><option value="">اختر الوزارة</option>${ministryOptions}</select></div>
      <div class="field"><label>اسم المخول</label><select id="l-rep"><option value="">اختر المخول (اختياري)</option></select></div>
      ` : `<div class="alert-banner reminder">${ICONS.warn}<span>لا توجد وزارات مضافة بعد. أضف وزارة أولاً من "إدارة الوزارات".</span></div>`}
      <div class="field" style="display:flex; gap:10px;">
        <div style="flex:1;"><label>تاريخ الكتاب</label><input id="l-date" type="date" value="${editData ? (editData.letterDate||'') : todayStr()}"></div>
        <div style="flex:1;"><label>عدد الكتاب</label><input id="l-number" type="text" placeholder="مثال: 1234" value="${editData ? escapeHTML(editData.letterNumber||'') : ''}"></div>
      </div>
      <div class="field"><label>الموضوع</label><textarea id="l-subject" placeholder="موضوع الكتاب...">${editData ? escapeHTML(editData.subject||'') : ''}</textarea></div>
      <div class="field"><label>اسم الشخص (اختياري)</label><input id="l-person" type="text" placeholder="اسم الشخص المعني بالكتاب" value="${editData ? escapeHTML(editData.personName||'') : ''}"></div>
      <div class="field"><label>إسناد إلى موظف (اختياري)</label><select id="l-emp"><option value="">بدون إسناد</option>${empOptions}</select></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-action="close">إلغاء</button>
        <button class="btn btn-primary" data-action="saveLetter">${isEdit ? 'حفظ التعديلات' : 'حفظ الكتاب'}</button>
      </div>
    </div>`;
  }

  function empSheetHTML(){
    const su = genUsername(), sp = genPassword();
    return `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>إضافة موظف</h2>
      <div class="field"><label>الاسم</label><input id="e-name" type="text" placeholder="اسم الموظف"></div>
      <div class="field"><label>المسمى الوظيفي (اختياري)</label><input id="e-role" type="text" placeholder="مثال: مساعد إداري"></div>
      <div class="field" style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="e-mailaccess" style="width:18px;height:18px;">
        <label for="e-mailaccess" style="margin:0;">منح صلاحية الوصول لتبويب "البريد"</label>
      </div>
      <div class="divider"></div>
      <div class="field"><label>اسم المستخدم لحساب الموظف</label><input id="e-user" type="text" value="${su}"><div class="field-sub">يمكن تعديله قبل الحفظ</div></div>
      <div class="field"><label>كلمة المرور المبدئية</label><input id="e-pass" type="text" value="${sp}"><div class="field-sub">شارك هذه البيانات مع الموظف لتسجيل الدخول لحسابه الخاص</div></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-action="close">إلغاء</button>
        <button class="btn btn-primary" data-action="saveEmp">حفظ الموظف</button>
      </div>
    </div>`;
  }

  function agendaSheetHTML(){
    const typeOptions = Object.keys(AGENDA_TYPES).map(k=>`<option value="${k}">${AGENDA_TYPES[k]}</option>`).join('');
    return `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>إضافة موعد إلى الجدول اليومي</h2>
      <div class="field" style="display:flex; gap:10px;">
        <div style="flex:1;"><label>التاريخ</label><input id="a-date" type="date" value="${todayStr()}"></div>
        <div style="flex:1;"><label>الوقت</label><input id="a-time" type="time" value="${nowTimeStr()}"></div>
      </div>
      <div class="field">
        <label>الجهة</label>
        <div class="cat-toggle">
          <div class="cat-opt sel-finance" data-cat="finance">اللجنة المالية</div>
          <div class="cat-opt" data-cat="bloc">كتلة الصادقون</div>
          <div class="cat-opt" data-cat="office">مكتب النائب</div>
        </div>
      </div>
      <div class="field"><label>النوع</label><select id="a-type">${typeOptions}</select></div>
      <div class="field"><label>الموضوع / العنوان</label><input id="a-title" type="text" placeholder="مثال: اجتماع لجنة الموازنة"></div>
      <div class="field"><label>تفاصيل (اختياري)</label><textarea id="a-details" placeholder="مكان الاجتماع، الحضور، ملاحظات..."></textarea></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-action="close">إلغاء</button>
        <button class="btn btn-primary" data-action="saveAgenda">حفظ الموعد</button>
      </div>
    </div>`;
  }

  function bindSheetEvents(type, editData){
    const overlay = document.getElementById('overlay');
    overlay.querySelectorAll('[data-action="close"]').forEach(el=>el.addEventListener('click', closeSheet));

    if (type==='task'){
      let selectedCat = editData ? editData.category : 'finance';
      let pendingAttachment = editData ? (editData.attachment || null) : null;
      if (editData){
        const empSel = overlay.querySelector('#f-emp');
        if (empSel) empSel.value = editData.employeeId || '';
      }
      const opts = overlay.querySelectorAll('.cat-opt');
      opts.forEach(o=>{
        o.addEventListener('click', ()=>{
          selectedCat = o.dataset.cat;
          opts.forEach(x=>x.classList.remove('sel-finance','sel-bloc','sel-office'));
          o.classList.add('sel-'+selectedCat);
        });
      });
      const fileInput = overlay.querySelector('#f-file');
      const fileLabel = overlay.querySelector('#f-file-label');
      const fileInfo = overlay.querySelector('#f-file-info');
      fileInput.addEventListener('change', ()=>{
        const file = fileInput.files[0];
        if (!file) return;
        const MAX = 600*1024;
        if (file.size > MAX){
          fileInfo.style.color = 'var(--danger)';
          fileInfo.textContent = 'الملف كبير جداً (الحد الأقصى 600 كيلوبايت). اختر ملفاً أصغر أو اضغطه.';
          fileInput.value = '';
          pendingAttachment = editData ? (editData.attachment || null) : null;
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev)=>{
          pendingAttachment = { name: file.name, type: file.type, dataUrl: ev.target.result, size: file.size };
          fileLabel.textContent = 'تغيير الملف المختار';
          fileInfo.style.color = 'var(--ok)';
          fileInfo.textContent = `تم اختيار: ${file.name} (${Math.round(file.size/1024)} كيلوبايت)`;
        };
        reader.readAsDataURL(file);
      });
      overlay.querySelector('[data-action="saveTask"]').addEventListener('click', ()=>{
        const title = overlay.querySelector('#f-title').value.trim();
        if (!title){ overlay.querySelector('#f-title').focus(); return; }
        const desc = overlay.querySelector('#f-desc').value.trim();
        const dueDate = overlay.querySelector('#f-duedate').value || null;
        const empId = overlay.querySelector('#f-emp').value || null;
        closeSheet();
        if (editData){
          col('tasks').doc(editData.id).update({ title, desc, dueDate, category: selectedCat, employeeId: empId, attachment: pendingAttachment || null })
            .catch(()=>alert('تعذر حفظ التعديلات، تحقق من الاتصال بالإنترنت'));
        } else {
          const taskId = uid();
          const taskObj = { id: taskId, title, desc, dueDate, category: selectedCat, employeeId: empId, createdAt: now(), status:'pending', statusChangedAt: null, attachment: pendingAttachment || null, replies: [] };
          col('tasks').doc(taskId).set(taskObj).catch(()=>alert('تعذر حفظ المهمة، تحقق من الاتصال بالإنترنت' + (pendingAttachment ? ' (قد يكون الملف المرفق كبيراً جداً)' : '')));
        }
      });
    } else if (type==='agenda'){
      let selectedCat = 'finance';
      const opts = overlay.querySelectorAll('.cat-opt');
      opts.forEach(o=>{
        o.addEventListener('click', ()=>{
          selectedCat = o.dataset.cat;
          opts.forEach(x=>x.classList.remove('sel-finance','sel-bloc','sel-office'));
          o.classList.add('sel-'+selectedCat);
        });
      });
      overlay.querySelector('[data-action="saveAgenda"]').addEventListener('click', ()=>{
        const title = overlay.querySelector('#a-title').value.trim();
        if (!title){ overlay.querySelector('#a-title').focus(); return; }
        const date = overlay.querySelector('#a-date').value || todayStr();
        const time = overlay.querySelector('#a-time').value || '00:00';
        const agendaType = overlay.querySelector('#a-type').value;
        const details = overlay.querySelector('#a-details').value.trim();
        const id = uid();
        const item = {
          id, date, time, type: agendaType, category: selectedCat, title, details,
          addedByName: state.session.name, addedByAccountId: state.session.id, createdAt: now()
        };
        closeSheet();
        col('agenda').doc(id).set(item).catch(()=>alert('تعذر حفظ الموعد، تحقق من الاتصال بالإنترنت'));
      });
    } else if (type==='letter'){
      const ministrySelect = overlay.querySelector('#l-ministry');
      const repSelect = overlay.querySelector('#l-rep');
      function refreshReps(selectedRepName){
        if (!repSelect || !ministrySelect) return;
        const m = state.ministries.find(x=>x.id===ministrySelect.value);
        const reps = m ? (m.reps||[]) : [];
        repSelect.innerHTML = '<option value="">اختر المخول (اختياري)</option>' + reps.map(r=>`<option value="${escapeHTML(r.name)}" ${selectedRepName===r.name?'selected':''}>${escapeHTML(r.name)}</option>`).join('');
      }
      if (ministrySelect){
        refreshReps(editData ? editData.repName : '');
        ministrySelect.addEventListener('change', ()=>refreshReps(''));
      }
      overlay.querySelector('[data-action="saveLetter"]').addEventListener('click', ()=>{
        const subject = overlay.querySelector('#l-subject').value.trim();
        if (!subject){ overlay.querySelector('#l-subject').focus(); return; }
        const ministryId = ministrySelect ? ministrySelect.value : '';
        const ministry = state.ministries.find(m=>m.id===ministryId);
        const repName = repSelect ? repSelect.value : '';
        const letterDate = overlay.querySelector('#l-date').value || todayStr();
        const letterNumber = overlay.querySelector('#l-number').value.trim();
        const personName = overlay.querySelector('#l-person').value.trim();
        const empId = overlay.querySelector('#l-emp').value || null;
        closeSheet();
        if (editData){
          col('letters').doc(editData.id).update({
            ministryId: ministryId||null, ministryName: ministry?ministry.name:'', repName, letterDate, letterNumber, subject, personName, employeeId: empId
          }).catch(()=>alert('تعذر حفظ التعديلات، تحقق من الاتصال بالإنترنت'));
        } else {
          const id = uid();
          col('letters').doc(id).set({
            id, ministryId: ministryId||null, ministryName: ministry?ministry.name:'', repName, letterDate, letterNumber, subject, personName, employeeId: empId,
            status:'pending', statusChangedAt:null, createdAt: now(), addedByName: state.session.name, addedByAccountId: state.session.id
          }).catch(()=>alert('تعذر حفظ الكتاب، تحقق من الاتصال بالإنترنت'));
        }
      });
    } else if (type==='officeReq'){
      overlay.querySelector('[data-action="saveOfficeReq"]').addEventListener('click', ()=>{
        const subject = overlay.querySelector('#or-subject').value.trim();
        const requesterName = overlay.querySelector('#or-requester').value.trim();
        if (!subject && !requesterName){ overlay.querySelector('#or-requester').focus(); return; }
        const assignedEmployeeIds = state.session.role==='admin'
          ? Array.from(overlay.querySelectorAll('.or-emp-check:checked')).map(cb=>cb.value)
          : null;
        const data = {
          requesterName,
          subject,
          entity: overlay.querySelector('#or-entity').value.trim(),
          officeName: overlay.querySelector('#or-office').value.trim(),
          requestStatus: overlay.querySelector('#or-reqstatus').value,
          status: overlay.querySelector('#or-letterstatus').value,
          officeReqNumber: overlay.querySelector('#or-reqnum').value.trim(),
          officeReqDate: overlay.querySelector('#or-reqdate').value || null,
          letterDate: overlay.querySelector('#or-letterdate').value || null,
          uploadedLetterDate: overlay.querySelector('#or-uploaddate').value || null,
          notes: overlay.querySelector('#or-notes').value.trim()
        };
        if (assignedEmployeeIds !== null) data.assignedEmployeeIds = assignedEmployeeIds;
        closeSheet();
        if (editData){
          col('office_requests').doc(editData.id).update(data).catch(()=>alert('تعذر حفظ التعديلات، تحقق من الاتصال بالإنترنت'));
        } else {
          const id = uid();
          col('office_requests').doc(id).set(Object.assign({id, status:'not_drafted', statusChangedAt:null, createdAt: now(), addedByName: state.session.name, addedByAccountId: state.session.id}, data))
            .catch(()=>alert('تعذر حفظ الطلب، تحقق من الاتصال بالإنترنت'));
        }
      });
    } else {
      overlay.querySelector('[data-action="saveEmp"]').addEventListener('click', ()=>{
        const name = overlay.querySelector('#e-name').value.trim();
        if (!name){ overlay.querySelector('#e-name').focus(); return; }
        const role = overlay.querySelector('#e-role').value.trim();
        const mailAccess = overlay.querySelector('#e-mailaccess').checked;
        const username = overlay.querySelector('#e-user').value.trim();
        const password = overlay.querySelector('#e-pass').value.trim();
        if (state.accounts.some(a=>a.username===username)){ alert('اسم المستخدم مستخدم بالفعل، يرجى اختيار اسم آخر'); return; }
        const empId = uid();
        const accId = uid();
        closeSheet();
        col('employees').doc(empId).set({ id: empId, name, role, mailAccess }).catch(()=>alert('تعذر حفظ بيانات الموظف، تحقق من الاتصال بالإنترنت'));
        col('accounts').doc(accId).set({ id: accId, username, password, role:'employee', employeeId: empId, name }).catch(()=>alert('تعذر إنشاء حساب الموظف، تحقق من الاتصال بالإنترنت'));
      });
    }
  }

  if (FIREBASE_READY) initFirebase(); else render();
  setInterval(()=>{ if(state.loaded && state.session){ checkAlertSound(); safeRender(); } }, 60000);
})();
</script>
</body>
</html>
